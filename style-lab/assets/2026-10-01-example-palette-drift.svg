<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Soft palette shapes drifting slowly">
  <!-- Example artifact from the style agent. Palette colors only:
       Kyoto Dusk #5b5f8d, Matcha Cream #9bb29e, Roasted Terracotta #da6b51,
       Vanilla Foam #f1dcba, Charcoal Brew #484149, page background #fbf7f0. -->
  <style>
    .drift { animation: drift 18s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-duration: 22s; animation-delay: -6s; }
    .d3 { animation-duration: 26s; animation-delay: -11s; }
    .d4 { animation-duration: 20s; animation-delay: -3s; }
    .breathe { animation: breathe 14s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes drift { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(28px, -18px) rotate(6deg); } }
    @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { .drift, .breathe { animation: none; } }
  </style>
  <rect width="1200" height="600" fill="#fbf7f0"/>
  <circle class="breathe" cx="860" cy="250" r="230" fill="#f1dcba" opacity="0.7"/>
  <rect class="drift" x="640" y="110" width="250" height="250" rx="28" fill="#5b5f8d" opacity="0.85" transform="rotate(-8 765 235)"/>
  <rect class="drift d2" x="860" y="250" width="200" height="200" rx="28" fill="#da6b51" opacity="0.8"/>
  <rect class="drift d3" x="560" y="330" width="170" height="170" rx="20" fill="#9bb29e" opacity="0.9"/>
  <circle class="drift d4" cx="1040" cy="150" r="46" fill="#9bb29e" opacity="0.75"/>
  <path class="drift d2" d="M 120 470 C 300 380, 470 520, 640 440" fill="none" stroke="#da6b51" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <circle class="breathe" cx="210" cy="170" r="70" fill="#5b5f8d" opacity="0.18"/>
  <circle cx="470" cy="210" r="8" fill="#484149" opacity="0.6"/>
</svg>
